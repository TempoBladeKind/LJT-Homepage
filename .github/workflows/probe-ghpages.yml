name: Finalize verification
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale gh-pages branch
        run: git push origin --delete gh-pages || true
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: List generated pages
        run: |
          echo "--- HTML pages ---"
          find _site -name '*.html' | sort
          echo "--- collections ---"
          find _site/publication _site/talks _site/portfolio _site/posts -type f 2>/dev/null | sort || true
      - name: Check Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /tmp/pg.txt -w "GET /pages HTTP %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          head -c 400 /tmp/pg.txt; echo
